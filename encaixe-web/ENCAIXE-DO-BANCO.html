/* --- ficha do sistema (so admin) --- */
#fichasis{margin:6px 0 2px;padding:8px 11px;background:#111721;border:1px solid #1f2733;border-radius:8px;
 font-size:11px;line-height:1.7;color:#8b94a3;max-width:820px}
#fichasis b{color:#c7cedb}
html[data-tema] #fichasis{background:var(--surf2)!important;border-color:var(--line)!important;color:var(--txt2)!important}
html[data-tema] #fichasis b{color:var(--txt)!important}
.sub{display:block!important;margin:2px 0 0!important}
.sub .fbt:first-child{margin-left:0}

/* --- receita do motor: contraste resolvido nos dois temas --- */
.receita{background:#11161d;border:1px solid #252c37;border-radius:8px;padding:10px 13px;margin:10px 0;
 font-size:12.5px;color:#dbe2ee}
.receita b{color:#fff}
.receitatt{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#8fa4c4!important}
.receitadim{color:#9aa4b2}
html[data-tema] .receita{background:var(--surf2)!important;border-color:var(--line)!important;color:var(--txt)!important}
html[data-tema] .receita b{color:var(--txt)!important}
html[data-tema] .receitatt{color:var(--acc)!important}
html[data-tema] .receitadim{color:var(--txt2)!important}

/* --- painel de build: numeros legiveis nos dois temas --- */
.bhdnum{text-transform:none;letter-spacing:0;font-size:11px;color:#c7cedb}
.bhdnum b{color:#fff}
.bhdnote{text-transform:none;letter-spacing:0;font-weight:400;color:#7d8794;font-size:10px}
html[data-tema] .bhdnum{color:var(--txt2)!important}
html[data-tema] .bhdnum b{color:var(--txt)!important;font-weight:800}
html[data-tema] .bhdnote{color:var(--txt2)!important}

/* --- grade do usuario: atributos (nome | base | otimizado) --- */
.athequ,.atgu{display:grid!important;grid-template-columns:1fr 90px 90px;align-items:center;text-align:right;gap:8px}
.athequ>span:first-child,.atgu>span:first-child{text-align:left}
.atgu b{font-weight:800}
/* --- grade do usuario: corpo (medida | no card) --- */
.fzhu,.fzru{display:grid!important;grid-template-columns:1fr 110px;align-items:center;text-align:right;gap:8px}
.fzhu>span:first-child,.fzru>span:first-child{text-align:left}

/* --- colisao de texto longo nas colunas do corpo (admin) --- */
.fzh,.fzr{grid-template-columns:minmax(120px,1fr) 90px 88px 88px 62px;gap:6px}
.fzr>span:not(:first-child),.fzr>b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fzr>span:first-child,.fzh>span:first-child{white-space:normal;overflow:visible;line-height:1.35}
.fzhu,.fzru{grid-template-columns:minmax(140px,1fr) 110px!important}
.fzru>span:first-child{white-space:normal;overflow:visible}

/* --- alinhamento das colunas do bloco 1 (admin) --- */
.athead,.atg{grid-template-columns:minmax(120px,1fr) 104px 54px 66px 54px 64px;gap:6px;align-items:center}
.atg>span:not(:first-child),.atg>b,.athead>span:not(:first-child){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atg>span:first-child{white-space:normal;line-height:1.35}

/* --- cabecalho do painel de build: parava de caber e as duas metades colidiam --- */
.bhd{flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.bhd>span:first-child{flex:1 1 auto;min-width:190px}
.bhd>span:last-child{flex:0 0 auto;white-space:nowrap}
.bhdnote{display:block;margin-top:1px}
@media(max-width:1400px){.bhd>span:last-child{white-space:normal}}

/* --- titulos longos de secao: quebram sem empurrar o resto --- */
.sec h3{line-height:1.45;overflow-wrap:anywhere}

/* --- barra lateral: segmentos e etiquetas sem sobreposicao --- */
@media(min-width:840px){
 #filtros .ctl .seg{flex-wrap:wrap}
 #filtros .ctl .seg div{flex:1 1 auto;min-width:64px;padding:5px 6px;font-size:11px;white-space:nowrap}
 #filtros .ctl .fld span{line-height:1.3}
 #filtros .ctl .dst{gap:4px}
}

/* --- cartao da grade: subtitulo nao pode invadir a nota --- */
.cd .mi{line-height:1.35;overflow-wrap:anywhere}

/* --- campos da barra lateral legiveis no tema claro --- */
@media(min-width:840px){
 html[data-tema] #filtros select,html[data-tema] #filtros input[type=search],html[data-tema] #filtros input[type=number]{
  background:var(--bg)!important;border:1px solid var(--line)!important;color:var(--txt)!important}
 html[data-tema] #filtros .fld span{color:var(--txt2)!important}
 html[data-tema] #filtros .seg div{background:var(--bg)!important;color:var(--txt)!important}
}

/* ============ BARRA LATERAL ESQUERDA (>=1100px) ============ */
@media(min-width:840px){
 header{position:static!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  border-bottom:1px solid #1f2733}
 html[data-lay=cmp] #filtros,#filtros{
  position:fixed;top:0;left:0;bottom:0;width:252px;z-index:40;
  overflow-y:auto;overscroll-behavior:contain;
  background:var(--surf,#0b0e13);border-right:1px solid var(--line,#1f2733);border-bottom:none;
  padding:10px 12px 40px;display:block!important}
 html[data-lay=cmp] header,header{margin-left:252px!important;padding-left:16px}
 html[data-lay=cmp] main,main{margin-left:252px!important;margin-right:auto!important;max-width:1680px}
 .grade{overflow:hidden}
 .cd{overflow:hidden}
 .cd .mi,.cd .nm{overflow-wrap:anywhere;word-break:break-word;max-width:100%}
 #filtros .fam{flex-direction:column;gap:6px;margin:0 0 10px}
 html[data-lay=cmp] #filtros .fam{margin:0 0 10px;gap:6px}
 html[data-lay=cmp] #filtros .ctl,html[data-lay=cmp] #filtros .pesos{display:flex}
 #filtros .ctl{flex-direction:column;align-items:stretch;gap:9px;
  border-top:1px solid #1f2733;padding-top:10px;margin-top:4px}
 html[data-tema] #filtros .ctl{border-top-color:var(--line)!important}
 #filtros .ctl .fld{width:100%}
 #filtros .ctl select,#filtros .ctl input[type=search],#filtros .ctl input[type=number]{width:100%!important}
 #filtros .ctl .seg{width:100%}
 #filtros .ctl .seg div{flex:1;text-align:center}
 #filtros .ctl .dst{display:flex;flex-wrap:wrap;margin-left:0}
 #filtros .ctl .hb,#filtros .ctl .btn{width:100%;margin:0}
 #filtros .setor{display:block;margin-bottom:8px}
 #filtros .setl{min-width:0;justify-content:flex-start;margin:0 0 4px;padding:0;
  font-size:9px;letter-spacing:1.4px;border:none}
 html[data-lay=cmp] #filtros .setl{min-width:0;padding-right:0;align-items:flex-start}
 #filtros .setg{gap:5px 6px}
 #filtros .famg{flex-wrap:wrap}
 #filtros .famt.fambt{min-width:0}
 #filtros .famg{flex-direction:row;align-items:center;gap:6px}
 #filtros .tabs{flex-wrap:wrap}
 /* a busca fica no topo da coluna, sempre a vista */
 #filtros .ctl .fld:first-child{order:-1}
 #navbt,#fbt{display:none!important}
}
@media(min-width:840px){
 #ov{z-index:9000}
 #voltar{left:266px}
}

/* ============ v127 · GRADE, RITMO E HIERARQUIA — sem tocar em cor ============ */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}

/* --- cabecalho da ficha: 3 colunas, a nota deixa de ser rodape do bloco --- */
.fhd{display:flex;flex-wrap:nowrap;gap:var(--s5);align-items:flex-start}
.fhdimg{width:100px;flex:0 0 auto}
.fhdid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.fhdid>div{margin:0}
.fhdnota{flex:0 0 auto;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;
 gap:2px;text-align:right;white-space:nowrap}
.fhdn{font-size:44px;font-weight:800;line-height:.95;letter-spacing:-.02em}
.fhdl{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;opacity:.72}
.fhdm{font-size:10.5px;opacity:.55}
@media(max-width:820px){
 .fhd{flex-wrap:wrap;gap:var(--s3)}
 .fhdimg{width:72px}
 .fhdnota{flex:1 1 100%;margin-left:0;flex-direction:row;align-items:baseline;gap:var(--s2);
  text-align:left;justify-content:flex-start}
 .fhdn{font-size:34px}
}

/* --- receita e guia dividem a faixa em vez de empilhar --- */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s3);
 align-items:stretch;margin:var(--s3) 0}
.duo>*{margin:0!important}
.duo:empty{display:none}

/* --- a coluna densa merece mais largura que a coluna esparsa --- */
.grid2{grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:var(--s4);margin-top:var(--s4);
 align-items:start}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.grid2>div{min-width:0}

/* --- ritmo: mais ar ACIMA do titulo do que abaixo, e grupos respiram --- */
.sec{padding:var(--s4) var(--s4) var(--s3);margin-bottom:var(--s3)}
.sec h3{margin:0 0 var(--s3);padding-bottom:var(--s2)}
.sec+.sec{margin-top:0}
.sec .mini+.chips{margin-top:var(--s1)}
.sec .chips+.mini{margin-top:var(--s3)!important}
.chips{gap:var(--s1) 5px}

/* --- a tabela de atributos: cabecalho de grupo com ar em cima --- */
.grptt{margin-top:var(--s4)!important;margin-bottom:var(--s1)!important}
.at:first-of-type+.grptt,.athead+.grptt{margin-top:var(--s2)!important}
.at{padding:3.5px 0}

/* --- painel de build: separado da tabela que vem depois --- */
.bpan{padding:var(--s3) var(--s4);margin-bottom:var(--s4)}
.brow{padding:5px 0}

/* --- barra lateral: grupos separados por espaco, nao por linha --- */
@media(min-width:840px){
 #filtros{padding:var(--s3) var(--s3) 48px}
 #filtros .setor{margin-bottom:var(--s4)}
 #filtros .setl{margin:0 0 var(--s2)}
 #filtros .fam{gap:0!important;margin:0 0 var(--s4)!important}
 #filtros .famg{margin-bottom:var(--s1)}
 #filtros .ctl{gap:var(--s3);padding-top:var(--s4);margin-top:0}
 #filtros .ctl .fld span{margin-bottom:1px}
}

/* --- correcoes da inspecao: nota nao encosta no fechar; tabela do corpo cabe na coluna --- */
.fhdnota{margin-right:34px}
@media(max-width:820px){.fhdnota{margin-right:0}}
.fzh,.fzr{grid-template-columns:minmax(0,1fr) 76px 54px 58px 52px!important;gap:4px!important}
.fzhu,.fzru{grid-template-columns:minmax(0,1fr) 96px!important}
.athead,.atg{grid-template-columns:minmax(0,1fr) 96px 48px 60px 48px 58px!important;gap:5px!important}
.athequ,.atgu{grid-template-columns:minmax(0,1fr) 78px 78px!important}

/* ============ v128 · A LATERAL É A BARRA — paleta oficial, nada inventado ============ */
@media(min-width:840px){
 /* a navegacao nasceu na barra verde-escura; ela continua sendo a barra, agora vertical */
 html[data-tema=claro] #filtros,html[data-tema=escuro] #filtros{
  background:var(--barra)!important;border-right:4px solid var(--dourado)!important;
  border-top:none!important;border-left:none!important;color:var(--barratxt)!important;
  overflow-x:hidden}
 html[data-tema] #filtros *{max-width:100%}
 html[data-tema=claro] #filtros .setl,html[data-tema=escuro] #filtros .setl,
 html[data-tema=claro] #filtros .famt,html[data-tema=escuro] #filtros .famt,
 html[data-tema=claro] #filtros .fld span,html[data-tema=escuro] #filtros .fld span,
 html[data-tema=claro] #filtros .dst>b,html[data-tema=escuro] #filtros .dst>b{
  color:rgba(255,255,255,.66)!important;border-color:rgba(255,255,255,.18)!important}
 html[data-tema=claro] #filtros .famt.fambt,html[data-tema=escuro] #filtros .famt.fambt{
  background:rgba(255,255,255,.10)!important;color:#fff!important;border-color:rgba(255,255,255,.16)!important}
 html[data-tema=claro] #filtros .tab,html[data-tema=escuro] #filtros .tab{
  background:rgba(255,255,255,.07)!important;border-color:rgba(255,255,255,.17)!important;
  color:rgba(255,255,255,.90)!important}
 html[data-tema=claro] #filtros .tab:hover,html[data-tema=escuro] #filtros .tab:hover{
  background:rgba(255,255,255,.15)!important;color:#fff!important}
 html[data-tema=claro] #filtros .tab.on,html[data-tema=escuro] #filtros .tab.on,
 html[data-tema=claro] #filtros .seg div.on,html[data-tema=escuro] #filtros .seg div.on{
  background:var(--dourado)!important;color:#17402f!important;border-color:var(--dourado)!important;font-weight:800!important}
 html[data-tema=claro] #filtros select,html[data-tema=escuro] #filtros select,
 html[data-tema=claro] #filtros input,html[data-tema=escuro] #filtros input{
  background:rgba(255,255,255,.11)!important;border:1px solid rgba(255,255,255,.24)!important;
  color:#fff!important}
 html[data-tema] #filtros select option{background:var(--barra);color:#fff}
 html[data-tema=claro] #filtros input::placeholder,html[data-tema=escuro] #filtros input::placeholder{
  color:rgba(255,255,255,.55)!important}
 html[data-tema=claro] #filtros .seg,html[data-tema=escuro] #filtros .seg{border-color:rgba(255,255,255,.24)!important}
 html[data-tema=claro] #filtros .seg div,html[data-tema=escuro] #filtros .seg div{
  background:rgba(255,255,255,.08)!important;color:rgba(255,255,255,.88)!important}
 html[data-tema=claro] #filtros .chp,html[data-tema=escuro] #filtros .chp{
  background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.22)!important;
  color:rgba(255,255,255,.85)!important}
 html[data-tema=claro] #filtros .ctl,html[data-tema=escuro] #filtros .ctl{
  border-top:1px solid rgba(255,255,255,.16)!important}
 /* botoes de administrador dentro da lateral: cabem e nao vazam */
 html[data-tema] #filtros .hb,html[data-tema] #filtros .btn{
  background:rgba(255,255,255,.09)!important;border:1px solid rgba(255,255,255,.24)!important;
  color:#fff!important;white-space:normal!important;line-height:1.3;padding:6px 8px!important;
  text-align:left}
 #filtros .dst{flex-wrap:wrap;width:100%}
 #filtros .ctl>*{max-width:100%;min-width:0}
}

/* ============ CABEÇALHO EM GRADE — para de se atropelar ============ */
header{display:grid;grid-template-columns:1fr;row-gap:6px;align-items:center}
h1{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
h1 .fbt{margin-left:0}
.sub{display:flex!important;flex-wrap:wrap;align-items:center;gap:8px;margin:0!important}
.sub .fbt,.sub #pesosbt{margin-left:0}
.fbt,.btn,.hb{white-space:nowrap;line-height:1.25}
#fichasis{grid-column:1/-1;margin:0}

/* o interruptor de visão é o controle mais importante do cabeçalho — tem que se enxergar */

 background:var(--dourado)!important;border-color:var(--dourado)!important;
 color:#17402f!important;font-weight:800!important}

/* --- caixa de punicao: legivel nos dois temas, sem cor nova --- */
.punbox{background:#2a1414;border:1px solid #4a2222;border-radius:8px;padding:10px 13px;
 font-size:12.5px;line-height:1.5;color:#f0d5d2}
.punbox b{color:#fff}
.puntt{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:#ff8b82!important}
html[data-tema] .punbox{background:var(--surf2)!important;border-color:var(--line)!important;color:var(--txt)!important}
html[data-tema] .punbox b{color:var(--txt)!important}
html[data-tema] .puntt{color:var(--txt2)!important}

/* --- cascata do usuario: 5 etapas --- */
.athequ5,.atgu5{display:grid!important;grid-template-columns:minmax(0,1fr) 62px 72px 72px 72px 72px;
 align-items:center;text-align:right;gap:6px}
.athequ5>span:first-child,.atgu5>span:first-child{text-align:left}
.atgu5 b{font-weight:800}

 .athequ5,.atgu5{grid-template-columns:minmax(0,1fr) 44px 50px 50px 50px 54px;gap:3px;font-size:11px}

}
.prov{opacity:.85;letter-spacing:.3px}

/* --- rodape de carregar mais --- */
.maiswrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
 padding:22px 0 8px;margin-top:6px}
#sentinela{width:100%;height:1px}

 background:#1b2330;border:1px solid #2b3543;color:#c7cedb}

.maisbt2{opacity:.75;font-weight:600}

html[data-tema] .maisbt:hover{color:var(--txt)!important;border-color:var(--acc)!important}

.mtcfgbt{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:5px;
 width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;padding:0;opacity:.75}
.mtcfgbt:hover{opacity:1}

      var abCab = h.lastIndexOf('<div', iCab);
      if (abCab < 0) return;
      var fim1 = _fimDiv(h, abCab);              /* o rotulo ÍMPETO */
      var ab2 = h.indexOf('<div', fim1);
      if (ab2 < 0) return;
      var fim2 = _fimDiv(h, ab2);                /* o cartao do nativo */
      var ab3 = h.indexOf('<div', fim2);
      var fim3 = (ab3 >= 0) ? _fimDiv(h, ab3) : fim2;   /* o cartao do adicionado */

      function _attrNome(i){
        try{ if (typeof ATTRS !== 'undefined' && ATTRS[i]) return ATTRS[i]; }catch(e){}
        return 'atributo ' + i;
      }
      function _chips(pares){
        var por = {}, out = [];
        (pares || []).forEach(function(x){ (por[x[1]] = por[x[1]] || []).push(_attrNome(x[0])); });
        Object.keys(por).sort(function(a, b){ return b - a; }).forEach(function(v){

                   + 'padding:4px 8px;border-radius:6px;white-space:nowrap">' + esc(nm) + '</span>');
          });
        });
        return out.join('');
      }
      function _grau(pares){
        var m = 0;
        (pares || []).forEach(function(x){ if (+x[1] > m) m = +x[1]; });
        return m ? ('+' + m) : '';
      }
      function _doCat(nome){
        try{ for (var i = 0; i < CAT.length; i++) if (CAT[i][0] === nome) return CAT[i][2]; }catch(e){}
        return null;
      }

      /* ---- o NATIVO ----
         ⛔ 19/08 — A ORDEM DAS FONTES E A QUE A SESSAO DO ENCAIXE MEDIU:
           1. `c.imp`   — a string que o `impeto_da_carta()` ja montou. E o que
                          o resto do sistema inteiro le. ESTA e a fonte.
           2. `pimpNativos(c)` — quando se precisa do nome e do efeito separados
           3. `c.nmn`   — a lista crua de nomes de fabrica
           4. `_natDoVetor(c)` — ultimo recurso; com o `c.imp` ja declarado ele
                          devolve "nao tem", e isso esta CERTO, nao e defeito
           ⛔ `pimpDoCard` NUNCA para o nome: o PIMP guarda o nome do efscout,
              em ingles ("Shooting +3"). So serve para o efeito.
         Medido no Ruud Gullit `88039045074410`: as quatro concordam em
         `Chute +3`. */
      var nativos = [];
      try{
        var _fab = String(c.imp || '').split('o motor pos:')[0]
                     .replace(/^\s*de f[aá]brica:\s*/i, '')
                     .replace(/\s*⚒\s*$/, '').trim();
        if (_fab && _fab.indexOf('efeito somado') < 0){
          _fab.split(/\s+[·+]\s+/).forEach(function(n){
            n = n.trim();
            if (n) nativos.push({nome: n, ef: _doCat(n)});
          });
        }
      }catch(e){}
      if (!nativos.length){
        try{
          var L = (typeof pimpNativos === 'function') ? pimpNativos(c) : null;
          if (L && L.length) nativos = L.map(function(x){ return {nome: x.nome, ef: x.efeito}; });
        }catch(e){}
      }
      if (!nativos.length && c.nmn && c.nmn.length){
        nativos = c.nmn.map(function(n){ return {nome: n, ef: _doCat(n)}; });
      }
      /* O nome exibido vem de `c.imp`, mas algumas linhas trazem apenas esse
         rotulo e nao carregam o efeito junto. Complete o efeito pelas fontes
         estruturadas sem trocar o nome em portugues que ja foi confirmado. */
      try{
        var _ln = (typeof pimpNativos === 'function') ? pimpNativos(c) : null;
        if (_ln && _ln.length){
          nativos.forEach(function(x, i){
            if ((!x.ef || !x.ef.length) && _ln[i] && _ln[i].efeito) x.ef = _ln[i].efeito;
          });
        }
        if (nativos.length === 1 && (!nativos[0].ef || !nativos[0].ef.length)
            && typeof pimpDoCard === 'function'){

          if (_pc && _pc.efeito) nativos[0].ef = _pc.efeito;
        }
      }catch(e){}
      if (!nativos.length){
        /* o efeito cru: melhor mostrar o que se sabe do que dizer "nao tem" */
        var cru = [];
        try{
          var v = expand(c.nm);
          for (var q = 0; q < 26; q++) if (v[q]) cru.push([q, v[q]]);
        }catch(e){}
        if (cru.length) nativos = [{nome: 'ímpeto nativo', ef: cru}];
      }

      /* ---- o ADICIONADO ---- */
      var addNome = '';
      try{

      /* ---- o CONDICIONAL: so quando o card tem ---- */

      /* ⛔ 19/08 — `cmode` NAO E O DEGRAU: e degrau-1.
         O `setCondCard(key, degrau)` grava `c.cmode = degrau - 1` (0,1,2) e o
         degrau que se chama e absoluto (1,2,3). Ler `cmode` como degrau e o
         leitor velho, e foi ele o `111,6 · 111,6 · 132,2` do Can Uzun. */
      var grauAtual = 1;
      try{ grauAtual = (+c.cmode || 0) + 1; }catch(e){}
      if (!(grauAtual >= 1 && grauAtual <= 3)) grauAtual = 1;

      var E_CARD = 'background:var(--d12);border:1px solid var(--d7);border-radius:12px;'
                 + 'padding:11px 13px;display:flex;flex-direction:column;gap:7px';
      var E_LINHA = 'display:flex;align-items:center;gap:9px';
      var E_BADGE = 'margin-left:auto;font-family:inherit;font-size:14px;font-weight:700;'
                  + 'padding:2px 9px;border-radius:7px;background:var(--d33);'
                  + 'border:1px solid var(--d11);color:var(--d1)';
      var E_FILA = 'display:flex;flex-wrap:wrap;gap:5px';

      function cartao(nome, rotulo, ef, extra){
        return '<div style="' + E_CARD + '">'
          + '<div style="' + E_LINHA + '">'
          +   '<b style="font-size:13.5px">' + esc(_extenso(nome)) + '</b>'

      var condHtml = '';
      if (temCond){
        var bts = '';
        [1, 2, 3].forEach(function(gg){

          var on = (gg === grauAtual);
          bts += '<b data-cond="' + gg + '" style="font-family:inherit;font-size:12px;'
              + 'font-weight:' + (on ? '700' : '500') + ';padding:4px 12px;border-radius:7px;'
              + (on ? 'background:linear-gradient(180deg,var(--d121),var(--d122));color:var(--d123);'
                    + 'box-shadow:0 3px 10px var(--d124)'
                    : 'background:var(--d12);border:1px solid var(--d18);color:var(--d85)')
              + (existe ? ';cursor:pointer' : ';opacity:.3')
              + '">+' + gg + '</b>';
        });
        condHtml = '<div style="display:flex;align-items:center;gap:9px;'
          + 'border-top:1px solid var(--d15);padding-top:9px;margin-top:2px">'
          + '<span style="display:flex;align-items:center;gap:6px;font-family:inherit;font-size:9px;'

          +   '<i style="width:10px;height:10px;background:var(--d120);display:block;'
          +   'clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)"></i>ÍMPETO CONDICIONAL</span>'

      }

      var novo = h.slice(abCab, fim1);   /* o rotulo ÍMPETO fica como ela desenhou */
      if (nativos.length){
        nativos.forEach(function(x, ix){
          novo += cartao(x.nome, 'nativo', x.ef, (ix === 0 ? condHtml : ''));
        });
      } else {
        /* ⛔ 19/08 — TRES ESTADOS, MEDIDOS NO BANCO (6.902 cards):
             3.214 dizem que NAO tem ....... "não tem ímpeto nativo"
               191 tem o codigo e o catalogo nao conhece o efeito
               433 nunca foram conferidos
           Escrever "nao tem" nos 624 ultimos e mentir com cara de certeza.
           E a mesma regra do Luis de 15/08: nao se poe zero no lugar de
           nao sei — aqui, nao se poe "nao tem" no lugar de "nao perguntei". */
        var _txt, _sub, _cor;
        if (c.impDesc){
          _txt = 'TEM ímpeto — efeito por conferir';
          _sub = 'a carta veio com ímpeto de fábrica, mas o catálogo não conhece esse código'
               + ((c.boostIds && c.boostIds.length) ? ' (' + c.boostIds.join(' e ') + ')' : '')
               + '. O motor calculou SEM ele: a pontuação está por baixo.';
          _cor = 'var(--d55)';
        } else if (c.temImp === 0){
          _txt = 'não tem ímpeto nativo';
          _sub = '';
          _cor = 'var(--d17)';
        } else {
          _txt = 'ímpeto ainda não conferido';
          _sub = 'ninguém perguntou esta carta ainda — não é o mesmo que não ter.';
          _cor = 'var(--d55)';
        }
        novo += '<div style="' + E_CARD + '"><div style="' + E_LINHA + '">'
             + '<b style="font-size:13px;color:' + _cor + '">' + _txt + '</b></div>'
             + (_sub ? '<div style="font-size:11px;color:var(--d17);line-height:1.45">'
                     + _sub + '</div>' : '')
             + condHtml + '</div>';
      }
      if (addNome){
        novo += cartao(addNome, 'adicionado', _doCat(addNome),
          '<div data-impsel="1" style="display:flex;align-items:center;gap:8px;'
          + 'border-top:1px solid var(--d15);padding-top:9px;margin-top:2px"></div>');
      } else {
        novo += '<div style="' + E_CARD + '"><div style="' + E_LINHA + '">'
             + '<b style="font-size:12.5px;font-weight:600;color:var(--d17)">'
             + (c.slot === 0 ? 'não tem vaga para ímpeto adicionado'
                             : (c.slot ? 'vaga livre' : 'vaga ainda não conferida'))
             + '</b></div>'
             + '<div data-impsel="1" style="display:flex;align-items:center;gap:8px"></div></div>';
      }

      h = h.slice(0, abCab) + novo + h.slice(fim3);
    })();

    /* ---------- tecnico ---------- */
    var tecNome = (c._tecNome !== undefined ? c._tecNome : c.TEC) || '';
    sub('>Pep Guardiola <span', '>' + esc(tecNome || '(nenhum)') + ' <span');
    var tb = [];
    try{ tb = (tecAtual(c) || []).map(function(x){ return (typeof tecPT === 'function') ? tecPT(x) : x; }); }catch(e){}
    sub('+1 Posse de bola · +1 Drible',
        tb.length ? tb.map(function(x){ return '+1 ' + esc(x); }).join(' · ') : 'sem técnico');
    /* ⛔ A MOLDURA E A DELA. O corpo da ficha ja e a grade de duas colunas —
       sem o `abre` dela o modal fica sem fundo e a home aparece por tras. */
    return M.ficha.abre + h + '</div>';
  };

  /* ⛔ 19/08 — POR QUE ESTE `t6Bar` EXISTE, e nao um `editBar(...)` direto.
     Medido: chamar `editBar` NAO mexe no card. Ele fechou sobre uma versao
     antiga de `_grava` (a casca tem tres, empilhadas por patches diferentes) e
     grava num lugar que ninguem mais le. A prova: os mesmos passos, chamados
     com as funcoes de hoje, mudam o nivel de 4 para 3 na hora.
     ⛔ A REGRA NAO E MINHA: e a mesma do editBar, linha por linha. So as pecas
        sao as vigentes. Se um dia `editBar` for consertado, esta funcao pode
        virar uma chamada a ele — e nada mais muda. */
  window.t6Bar = function(key, bar, d, raiz){
    var c = null;
    try{ c = _card(key); }catch(e){}
    if (!c) return;
    /* ⛔ 19/08 — A TRAVA DA ABA, PELA DECIMA VEZ PEDIDA.
       Regra da casca: barra so se mexe na aba "DO MEU JEITO" (`livre`). Na aba
       do MAXIMO a carta ja esta no teto — nao ha o que subir. A casca tinha a
       trava (`guarda('editBar', travaBarra)`), mas o `t6Bar` grava direto e
       passava por fora dela. Agora a mesma regra vale aqui. */
    if (window.t6Modo() !== 'livre'){
      window.t6AvisoBar(raiz, window.t6Modo() === 'motor'
        ? 'no máximo não se edita'
        : 'edite na aba DO MEU JEITO');
      return;
    }
    try{ _marca(key); }catch(e){}
    var lvl = _lvlDe(c), antes = lvl[bar] || 0;
    var nv = Math.max(0, Math.min(25, antes + d));
    if (nv === antes) return;
    lvl[bar] = nv;
    if (gastoDe(lvl) > (c.orc || 0)){
      lvl[bar] = antes;
      window.t6AvisoBar(raiz, 'não cabe: só sobram ' + ((c.orc || 0) - gastoDe(lvl)) + ' pts');
      return;
    }
    try{ _grava(c, lvl); }catch(e){ return; }
    try{ window.t6ReabreFicha(key); }catch(e){}
  };
  /* o aviso mora no proprio rotulo do orcamento, por dois segundos —

  window.t6AvisoBar = function(raiz, txt){

  /* ⛔ 19/08 — A REGRA SIMETRICA DO CAMPINHO, DE VOLTA.

  window.t6Pos = function(pos, key){

    /* ⛔ 19/08 — SO O ELEMENTO MAIS INTERNO.

    /* ⛔ 19/08 — AS TRES ABAS DO CARD, LIGADAS NO `encModo` DA CASCA.

    (function(){

    /* os balõezinhos dos `i` — a designer escreveu o texto, faltava fazer valer */
    try{ window.t6Hover(raiz); }catch(e){}

    /* ⛔ 19/08 — OS BOTOES DO CONDICIONAL, AGORA PELO DADO.
       Antes eles eram achados por TEXTO: `porTexto('+1')` casava com qualquer
       elemento cujo texto fosse "+1" — inclusive as CELULAS DA TABELA DE
       ATRIBUTOS, que estao cheias de "+1". Metade dos cliques ia parar num
       atributo, e o botao de verdade chamava `toggleCondCard`, que so cicla e
       ainda estava travado fora da aba livre.
       Agora cada botao carrega o proprio degrau (`data-cond`) e chama o
       `setCondCard(key, degrau)` da casca, que troca a build inteira que o
       motor gravou para aquele degrau. Degrau que o motor nao calculou fica
       apagado e nao responde. */
    todos('[data-cond]').forEach(function(el){
      var g = +el.getAttribute('data-cond');
      var existe = (g === 1);
      try{ existe = existe || !!(_cardAqui && _cardAqui.CD && _cardAqui.CD[String(g)]); }catch(e){}
      if (!existe) return;
      el.style.cursor = 'pointer';
      el.onclick = function(){
        try{ if (typeof setCondCard === 'function') return setCondCard(key, g); }catch(e){}
        try{ toggleCondCard(key); }catch(e){}
      };
    });

    /* o seletor do impeto ADICIONADO — so na aba FAZER MINHA BUILD.
       Algumas variantes do molde eliminam o `data-impsel` vazio ao montar o
       cartao. Nesse caso, recria-se a ancora dentro do proprio cartao de
       "vaga livre"; o usuario nunca fica apenas com a legenda sem controle. */
    if (!_travado && !todos('[data-impsel]').length){
      var vagaImp = porTexto('vaga livre')[0];
      if (vagaImp){
        var cardImp = vagaImp;
        for (var vi=0; vi<4 && cardImp.parentNode; vi++){
          if ((cardImp.getAttribute && (cardImp.getAttribute('style')||'').indexOf('border-radius:12px') >= 0)) break;
          cardImp = cardImp.parentNode;
        }
        if (cardImp && cardImp.appendChild){
          var ancoraImp = document.createElement('div');
          ancoraImp.setAttribute('data-impsel','1');
          ancoraImp.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:7px;width:100%';
          cardImp.appendChild(ancoraImp);
        }
      }
    }
    todos('[data-impsel]').forEach(function(el){
      el.innerHTML = '';
      if (_travado){
        el.style.display = 'none';
        return;
      }
      var ops = [];
      try{ ops = (typeof impOpcoes === 'function') ? (impOpcoes(_cardAqui) || []) : []; }catch(e){}
      var atual = '';
      try{ atual = (typeof impAdicionado === 'function') ? (impAdicionado(_cardAqui) || '') : ''; }catch(e){}
      var sel = document.createElement('select');
      sel.style.cssText = 'flex:1 1 auto;min-width:0;background:var(--d10);border:1px solid var(--d18);'
        + 'color:var(--d8);font:inherit;font-size:11.5px;padding:5px 8px;border-radius:7px;cursor:pointer';
      var html = '<option value="">(nenhum)</option>';
      for (var q = 0; q < ops.length; q++){
        html += '<option' + (ops[q] === atual ? ' selected' : '') + '>' + esc(ops[q]) + '</option>';
      }
      sel.innerHTML = html;
      sel.onchange = function(){
        try{ editImp(key, sel.value); }catch(e){}
      };
      el.appendChild(sel);
      if (atual){
        var x = document.createElement('b');
        x.textContent = '×';
        x.title = 'tirar este ímpeto';
        x.style.cssText = 'cursor:pointer;color:var(--d13);font-size:14px;line-height:1;flex:none';
        x.onclick = function(){ try{ editImp(key, ''); }catch(e){} };
        el.appendChild(x);
      }
    });
  };

  window.t6Melhores = function(lista, quantos){
    var por = {};
    lista.forEach(function(c){
      var k = c.nome, v = pct(c);
      if (!por[k] || v > por[k][1]) por[k] = [c, v];
    });
    return Object.keys(por).map(function(k){ return por[k]; })
      .sort(function(a, b){ return b[1] - a[1]; })
      .slice(0, quantos || 3).map(function(x){ return x[0]; });
  };
})();

/* ========================================================================
   PAGINA DINAMICA DO CARD — 19/08/2026

   Uma unica pagina atende todos os cards. O identificador e a funcao ficam
   na URL; a ficha aprovada continua sendo desenhada pelo mesmo `t6TelaFicha`.
   O modal nao foi apagado: o commit 2865f5c e o arquivo de checkpoint guardam
   exatamente o estado anterior a esta mudanca.
   ======================================================================== */
(function(){
  if (window.T6_PAGINA_CARD) return;
  window.T6_PAGINA_CARD = 1;

  var css = document.createElement('style');
  css.textContent = [
    'html[data-t6pagina="card"],html[data-t6pagina="card"] body{min-height:100%;background:var(--d3,#07100b)}',
    'html[data-t6pagina="card"] body{overflow:auto!important}',
    'html[data-t6pagina="card"] #filtros,html[data-t6pagina="card"] body>main{display:none!important}',
    'html[data-t6pagina="card"] #ov{position:relative!important;inset:auto!important;display:block!important;',
      'z-index:1!important;overflow:visible!important;min-height:calc(100vh - 72px);padding:20px 18px 92px!important;',
      'background:var(--d3,#07100b)!important}',
    'html[data-t6pagina="card"] #box{max-width:1440px;margin:0 auto}',
    'html[data-t6pagina="card"] #voltar{display:block!important;position:fixed!important;z-index:80!important}',
    '@media(max-width:700px){html[data-t6pagina="card"] #ov{padding:8px 0 82px!important}}'
  ].join('');
  (document.head || document.documentElement).appendChild(css);

  function partes(key){
    var s=String(key||''), i=s.indexOf('|');
    return i<0 ? [s,''] : [s.slice(0,i),s.slice(i+1)];
  }
  function urlDaFicha(key){
    var p=partes(key), u=new URL(location.href);
    u.searchParams.set('card',String(p[0]).split('@')[0]);
    u.searchParams.set('funcao',p[1]);
    u.searchParams.set('modo',(typeof window.t6Modo==='function'&&window.t6Modo()==='livre')?'minha-build':'maximo');
    return u.pathname+u.search+u.hash;
  }
  function ativa(key){
    if(!key) return;
    var jaEstavaNaFicha=document.documentElement.getAttribute('data-t6pagina')==='card';
    document.documentElement.setAttribute('data-t6pagina','card');
    try{ document.body.setAttribute('data-t6pagina','card'); }catch(e){}
    try{
      var st={ficha:1,paginaCard:1,key:String(key)};
      history.replaceState(st,'',urlDaFicha(key));
    }catch(e){}
    /* So a entrada vinda da home comeca no topo. Trocar funcao, posicao ou
       aba dentro da ficha conserva exatamente o ponto de leitura. */
    if(!jaEstavaNaFicha) try{ window.scrollTo(0,0); }catch(e){}
  }
  function desativa(){
    document.documentElement.removeAttribute('data-t6pagina');
    try{ document.body.removeAttribute('data-t6pagina'); }catch(e){}
  }
  window.t6PaginaAtiva=ativa;
  window.t6PaginaDesativa=desativa;

  function liga(){
    if(typeof window.abrir!=='function') return setTimeout(liga,250);
    if(window._t6AbrirPagina) return;
    window._t6AbrirPagina=window.abrir;
    window.abrir=function(key){
      /* Ao sair da home, a linha clicada serve para identificar o CARD, nao
         para escolher sua funcao inicial. A pagina comeca na melhor funcao
         ligada a posicao nativa. URL direta/F5 conserva a funcao da URL. */
      try{
        var qp=new URLSearchParams(location.search);
        var entrando=!document.documentElement.getAttribute('data-t6pagina') && !qp.get('card');
        if(entrando){
          var pc=partes(key), base=String(pc[0]).split('@')[0], cc=_card(key);
          window._T6_INICIAL_CARD=window._T6_INICIAL_CARD||{};
          window._T6_INICIAL_CARD[base]=1;
          var inicial=(typeof window.t6InicialDaPosicaoNativa==='function')
            ? window.t6InicialDaPosicaoNativa(cc) : null;
          if(inicial) key=inicial.id+'|'+inicial.tipo;
        }
      }catch(e){}
      var r=window._t6AbrirPagina.call(this,key);
      ativa(key);
      return r;
    };
    /* `reabrir` usa o `abrir` global e, portanto, mantem a pagina e atualiza
       funcao/modo na URL sem criar outra ficha nem outra pagina fisica. */
    var fecharAnterior=window.fechar;
    if(typeof fecharAnterior==='function'){
      window.fechar=function(){
        desativa();
        return fecharAnterior.apply(this,arguments);
      };
    }
    abreDaUrl();
  }

  function abreDaUrl(){
    var q=new URLSearchParams(location.search), id=q.get('card'), fn=q.get('funcao');
    if(!id) return;
    var base=String(id).split('@')[0], abriu=false, cargaCompleta=!!fn;
    function abreQuandoDisponivel(){
      if(abriu) return true;
      /* Sem funcao na URL, espera todas as linhas do card e aplica a regra de
         entrada: posicao nativa primeiro, maior funcao dela depois. */
      if(!fn && !cargaCompleta) return false;
      var c=null, primeira=null;
      try{
        primeira=(typeof D!=='undefined'?D:[]).find(function(x){
          return String(x.id).split('@')[0]===base;
        });
        c=fn ? (typeof D!=='undefined'?D:[]).find(function(x){
          return String(x.id).split('@')[0]===base && x.tipo===fn;
        }) : ((typeof window.t6InicialDaPosicaoNativa==='function' && primeira)
          ? window.t6InicialDaPosicaoNativa(primeira) : primeira);
      }catch(e){}
      if(!c) return false;
      abriu=true;
      var key=c.id+'|'+c.tipo;
      try{ window._T6ABA=q.get('modo')==='minha-build'?'livre':'motor'; }catch(e){}
      try{ window.ENC_MODO=window._T6ABA; }catch(e){}
      window.abrir(key);
      if(q.get('modo')==='minha-build' && typeof window.t6AbreLivreZerado==='function')
        window.t6AbreLivreZerado(key);
      return true;
    }
    /* No F5 a home ainda nao carregou a linha do card. Busca diretamente as
       linhas desse card antes de abrir a ficha; assim a URL e uma rota real,
       e nao depende da busca/listagem da pagina inicial ter sido montada. */
    var tentativas=0;
    (function esperaD(){
      if(typeof D==='undefined' && ++tentativas<80) return setTimeout(esperaD,100);
      if(abreQuandoDisponivel()) return;
      var url='https://trqqpsnafpbudtvvicch.supabase.co/rest/v1/tela_encaixe'
        +'?select=linha&card_id=eq.'+encodeURIComponent(base)+'&order=funcao.asc';
      var chave='sb_publishable_XTKGboY9RyYiirPiIsWMhw_P8B51cHj';
      fetch(url,{headers:{apikey:chave,Authorization:'Bearer '+chave}})
       .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
       .then(function(rows){
         (rows||[]).forEach(function(r){
           var x=r&&r.linha;
           if(!x||x.id===undefined||x.tipo===undefined) return;
           var repetida=false;
           for(var i=0;i<D.length;i++){
             var ja=D[i];
             if(ja&&ja.id!=='MOLDE'&&String(ja.id).split('@')[0]===base
                && (typeof _mesmaFn==='function'?_mesmaFn(ja.tipo,x.tipo):ja.tipo===x.tipo)){
               repetida=true; break;
             }
           }
           if(!repetida) D.push(x);
         });
         try{ if(typeof _pos_D==='function') _pos_D(); }catch(e){}
         cargaCompleta=true;
         abreQuandoDisponivel();
       })
       .catch(function(){
         /* Uma falha temporaria nao transforma a rota em home: conserva o
            estado de pagina e tenta de novo por alguns segundos. */
         var n=0;(function tenta(){
           if(abreQuandoDisponivel()||++n>40)return;
           setTimeout(tenta,250);
         })();
       });
    })();
  }

  window.addEventListener('popstate',function(){
    var q=new URLSearchParams(location.search);
    if(!q.get('card')) desativa();
  });
  liga();
})();
</script>
