<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encaixe · TrueFootball</title>
<style>
  :root{
    --fundo:#0d1117; --caixa:#161b22; --linha:#21262d; --borda:#30363d;
    --texto:#e6edf3; --fraco:#8b949e; --realce:#2f81f7; --bom:#3fb950;
    --medio:#d29922; --ruim:#f85149; --meu:#a371f7;
  }
  *{box-sizing:border-box}
  /* A ESCALA: 11 · 13 · 17 · 21 · 27, razao 1,28 entre degraus.
     Antes era 11/12/13/14/15/16 — seis tamanhos quase iguais, que e o mesmo
     que nao ter hierarquia: o olho nao sabe onde pousar. */
  body{margin:0;background:var(--fundo);color:var(--texto);
       font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--caixa);
         border-bottom:1px solid var(--borda);padding:14px 16px}
  .topo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:21px;margin:0;font-weight:650;letter-spacing:-.2px;line-height:1.1}
  h1 span{color:var(--fraco);font-weight:400;font-size:13px}
  .estado{margin-left:auto;font-size:11px;color:var(--fraco)}
  .estado b{color:var(--bom)}
  .estado.erro b{color:var(--ruim)}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  input,select,button{background:var(--fundo);color:var(--texto);
       border:1px solid var(--borda);border-radius:6px;padding:7px 10px;font:inherit}
  input:focus,select:focus{outline:2px solid var(--realce);outline-offset:-1px}
  button{cursor:pointer}
  button:hover{border-color:var(--realce)}
  button.ligado{background:var(--realce);border-color:var(--realce);color:#fff}
  main{padding:16px;max-width:1400px;margin:0 auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:9px 10px;color:var(--fraco);font-weight:500;font-size:11px;
     text-transform:uppercase;letter-spacing:.6px;
     border-bottom:1px solid var(--borda);white-space:nowrap;cursor:pointer;user-select:none}
  th:hover{color:var(--texto)}
  th.ativo{color:var(--realce)}
  td{padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
  tr.carta:hover{background:var(--caixa)}
  tr.carta{cursor:pointer}
  .nome{font-weight:600;font-size:15px;line-height:1.25;display:flex;align-items:center;gap:7px}
  .estrela{background:none;border:0;padding:0;font-size:15px;line-height:1;
           color:var(--borda);cursor:pointer;transition:color .12s}
  .estrela:hover{color:var(--meu)}
  .estrela.minha{color:var(--meu)}
  .sub{color:var(--fraco);font-size:11px}
  .nota{font-weight:700;font-variant-numeric:tabular-nums;font-size:21px;line-height:1.1;
        letter-spacing:-.5px}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;
        border:1px solid var(--borda);color:var(--fraco);white-space:nowrap}
  .pill.sp{border-color:var(--bom);color:var(--bom)}
  .pill.s{border-color:var(--realce);color:var(--realce)}
  .hab{color:var(--fraco);font-size:11px;max-width:340px;line-height:1.45}
  .detalhe td{background:#0b0f14;border-bottom:1px solid var(--borda)}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .bloco h4{margin:0 0 6px;font-size:11px;color:var(--fraco);
            text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .bloco div{font-size:13px}
  /* O aviso NAO leva barra colorida na lateral. O titulo ja diz a gravidade,
     e barra lateral em card e o cliche visual de sempre. */
  .aviso{background:var(--caixa);border:1px solid var(--borda);
         border-radius:8px;padding:18px 20px;margin:16px 0;max-width:680px}
  .aviso h3{margin:0 0 10px;font-size:17px;font-weight:650;color:var(--medio)}
  .aviso.ruim h3{color:var(--ruim)}
  .aviso p{margin:8px 0;color:var(--fraco)}
  code{background:var(--fundo);border:1px solid var(--borda);border-radius:4px;
       padding:1px 5px;font-size:11px}
  .vazio{text-align:center;color:var(--fraco);padding:60px 20px;font-size:15px}
  .rodape{margin-top:24px;padding-top:14px;border-top:1px solid var(--borda);
          color:var(--fraco);font-size:11px}
</style>
</head>
<body>

<header>
  <div class="topo">
    <h1>Encaixe <span>· TrueFootball</span></h1>
    <div class="estado" id="estado">iniciando…</div>
  </div>
  <div class="filtros">
    <input id="busca" placeholder="buscar carta pelo nome…" style="min-width:220px">
    <select id="funcao"><option value="">todas as funções</option></select>
    <select id="tier">
      <option value="">todo tier</option>
      <option value="S+">S+</option><option value="S">S</option>
      <option value="A">A</option><option value="B">B</option>
    </select>
    <button id="soMeu">só o meu time</button>
    <select id="quantas">
      <option value="100">100 linhas</option>
      <option value="300" selected>300 linhas</option>
      <option value="1000">1000 linhas</option>
    </select>
  </div>
</header>

<main>
  <div id="conteudo"><div class="vazio">carregando…</div></div>
  <div class="rodape" id="rodape"></div>
</main>

<script>
// ===========================================================================
//  CONFIGURACAO — o unico lugar que precisa ser editado
//
//  ⛔ A CHAVE AQUI TEM QUE SER A `anon`, NUNCA A DO config.txt.
//     Este arquivo roda no navegador: qualquer pessoa que abrir consegue ler
//     a chave. A `anon` so faz o que as regras (RLS) do Supabase permitirem —
//     e a gente vai permitir SOMENTE LEITURA nas tabelas da tela.
//     A chave do config.txt ESCREVE. Ela nunca pode chegar aqui.
// ===========================================================================
const CFG = {
  url:  'https://trqqpsnafpbudtvvicch.supabase.co',
  // A chave publicavel do projeto. Ela e PARA ser publica — o que protege o
  // banco nao e ela ficar escondida, e a regra: medido em 17/08, ela LE 14
  // tabelas e NAO ESCREVE em nenhuma. A do config.txt (service_role) escreve
  // e nunca pode aparecer aqui.
  anon: 'sb_publishable_XTKGboY9RyYiirPiIsWMhw_P8B51cHj'
};

// ---------------------------------------------------------------- o estado
const S = {
  funcoes: [], meuTime: new Set(), linhas: [], cards: new Map(), bonus: new Map(),
  ordem: 'nota', desc: true, soMeu: false, aberta: null, carregando: false, guarda: true
};

const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ===========================================================================
//  O MEU TIME — de cada um, no navegador de cada um
//
//  Ordem do Luis, 17/08: "cada usuario vai ter o seu. A pessoa entra, se ela
//  nao fizer login ela usa e depois apaga, ficando no navegador dela. Se ela
//  quiser guardar, precisa de login."
//
//  Etapa de agora: SEM LOGIN. O time mora no navegador e nao sai dali — nao
//  vai para o banco, nao e visto por mais ninguem.
//  Etapa seguinte: com login, isto passa a gravar numa tabela por usuario, e
//  a unica coisa que muda aqui e o corpo de `salvaMeuTime` e `carregaMeuTime`.
//
//  ⚠️ O navegador pode recusar a memoria (aba anonima, cookie bloqueado).
//     Quando recusa, o time continua funcionando na sessao e some ao fechar —
//     em vez de a tela quebrar.
// ===========================================================================
const CHAVE_TIME = 'encaixe.meu_time.v1';

function carregaMeuTime() {
  try {
    const cru = window.localStorage.getItem(CHAVE_TIME);
    if (cru) JSON.parse(cru).forEach(i => S.meuTime.add(String(i)));
    S.guarda = true;
  } catch (e) {
    S.guarda = false;   // segue em memoria, sem barulho
  }
}

function salvaMeuTime() {
  if (!S.guarda) return;
  try { window.localStorage.setItem(CHAVE_TIME, JSON.stringify([...S.meuTime])); }
  catch (e) { S.guarda = false; }
}

function viraMinha(id) {
  id = String(id);
  if (S.meuTime.has(id)) S.meuTime.delete(id); else S.meuTime.add(id);
  salvaMeuTime();
  if (S.soMeu) carrega(); else desenha();
}

function diz(txt, erro) {
  const e = $('estado');
  e.className = 'estado' + (erro ? ' erro' : '');
  e.innerHTML = txt;
}

// ------------------------------------------------------------- o PostgREST
async function pega(tabela, query) {
  const r = await fetch(CFG.url.replace(/\/$/, '') + '/rest/v1/' + tabela + '?' + query, {
    headers: { apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' em ' + tabela + ': ' + (await r.text()).slice(0, 200));
  return r.json();
}

// ⛔ O PostgREST corta em 1000 linhas por resposta. Pedir mais e receber 1000
//    calado ja mordeu este sistema antes — por isso aqui a paginacao e explicita.
async function pegaTudo(tabela, query, teto) {
  const fora = []; let de = 0; const passo = 1000;
  while (fora.length < (teto || Infinity)) {
    const p = await pega(tabela, query + '&limit=' + passo + '&offset=' + de);
    fora.push(...p);
    if (p.length < passo) break;
    de += passo;
  }
  return fora;
}

// ------------------------------------------------------------- o carregamento
async function comeca() {
  if (CFG.url.startsWith('COLE_AQUI')) return semConfig();
  try {
    diz('lendo o banco…');

    const funcoes = await pega('funcoes', 'select=nome&order=nome');
    S.funcoes = funcoes.map(f => f.nome || f.funcao).filter(Boolean);
    carregaMeuTime();

    const sel = $('funcao');
    S.funcoes.forEach(f => {
      const o = document.createElement('option');
      o.value = o.textContent = f; sel.appendChild(o);
    });

    await carrega();
  } catch (e) {
    falhou(e);
  }
}

async function carrega() {
  if (S.carregando) return;
  S.carregando = true;
  try {
    const quantas = +$('quantas').value;
    const funcao = $('funcao').value;
    const busca = $('busca').value.trim();

    diz('buscando as builds…');

    // ⛔ A CONSULTA VAI FILTRADA PARA O BANCO, nao para o navegador.
    //    Sao 12 mil builds; trazer tudo para filtrar aqui e o vicio que fez
    //    o HTML antigo ter 39 MB.
    let q = 'select=card_id,funcao,b1,tecnico,impeto,habilidades,estilo,origem'
          + '&order=b1.desc&limit=' + quantas;
    if (funcao) q += '&funcao=eq.' + encodeURIComponent(funcao);

    let builds = await pega('builds', q);

    // o nome nao esta na builds — vem da cards_base, pelos ids que voltaram
    const ids = [...new Set(builds.map(b => String(b.card_id)))];
    const cards = await porPedacos(ids, 150, lote =>
      pega('cards_base',
        'select=card_id,nome,ovr,tier,posicao,posicao_nativa,estilo_de_jogo'
        + '&card_id=in.(' + lote.map(i => '"' + i + '"').join(',') + ')'));
    cards.forEach(c => S.cards.set(String(c.card_id), c));

    // ⛔ 17/08 — NAO PEDIR A COLUNA `faltou`. Ela nao existe na tabela `bonus`:
    //    o sql/23-bonus-faltou.sql nunca foi rodado. Pedir devolve
    //    HTTP 400 · 42703 "column bonus.faltou does not exist" e a tela inteira
    //    morre. Quando a coluna subir, e so voltar a pedir aqui.
    const bon = await porPedacos(ids, 150, lote =>
      pega('bonus', 'select=card_id,funcao,b_total'
        + '&card_id=in.(' + lote.map(i => '"' + i + '"').join(',') + ')'));
    bon.forEach(b => S.bonus.set(String(b.card_id) + '|' + b.funcao, b));

    if (busca) {
      const alvo = busca.toLowerCase();
      builds = builds.filter(b => {
        const c = S.cards.get(String(b.card_id));
        return c && (c.nome || '').toLowerCase().includes(alvo);
      });
    }
    const tier = $('tier').value;
    if (tier) builds = builds.filter(b => (S.cards.get(String(b.card_id)) || {}).tier === tier);
    if (S.soMeu) builds = builds.filter(b => S.meuTime.has(String(b.card_id)));

    S.linhas = builds;
    diz('<b>' + builds.length + '</b> linhas · ' + S.cards.size + ' cartas · lido do banco');
    desenha();
  } catch (e) {
    falhou(e);
  } finally {
    S.carregando = false;
  }
}

// o `in.()` do PostgREST tem limite de tamanho de URL — por isso vai em pedaços
async function porPedacos(ids, tam, fn) {
  const fora = [];
  for (let i = 0; i < ids.length; i += tam) fora.push(...await fn(ids.slice(i, i + tam)));
  return fora;
}

// ------------------------------------------------------------------ a tela
function notaDe(b) {
  const bo = S.bonus.get(String(b.card_id) + '|' + b.funcao);
  const extra = bo && typeof bo.b_total === 'number' ? bo.b_total : 0;
  return { total: (b.b1 || 0) + extra, base: b.b1 || 0, extra: extra,
           faltou: (bo && bo.faltou) || [] };
}

const COLUNAS = [
  ['nome',    'carta'],
  ['ovr',     'ovr'],
  ['funcao',  'função'],
  ['nota',    'nota'],
  ['tecnico', 'técnico'],
  ['impeto',  'ímpeto'],
  ['hab',     'habilidades']
];

function desenha() {
  const alvo = $('conteudo');
  if (!S.linhas.length) {
    alvo.innerHTML = '<div class="vazio">'
      + (S.soMeu && !S.meuTime.size
         ? 'Seu time está vazio. Clique na ★ ao lado de uma carta para pôr ela aqui.'
         : 'Nenhuma linha com esses filtros.')
      + '</div>';
    $('rodape').textContent = '';
    return;
  }

  const linhas = [...S.linhas].sort((a, b) => {
    const ca = S.cards.get(String(a.card_id)) || {}, cb = S.cards.get(String(b.card_id)) || {};
    let x, y;
    switch (S.ordem) {
      case 'nome': x = ca.nome || ''; y = cb.nome || ''; break;
      case 'ovr':  x = ca.ovr || 0;   y = cb.ovr || 0;   break;
      case 'funcao': x = a.funcao || ''; y = b.funcao || ''; break;
      default: x = notaDe(a).total; y = notaDe(b).total;
    }
    const r = x < y ? -1 : x > y ? 1 : 0;
    return S.desc ? -r : r;
  });

  let h = '<table><thead><tr>';
  COLUNAS.forEach(([k, r]) => {
    h += '<th data-ord="' + k + '" class="' + (S.ordem === k ? 'ativo' : '') + '">'
       + esc(r) + (S.ordem === k ? (S.desc ? ' ↓' : ' ↑') : '') + '</th>';
  });
  h += '</tr></thead><tbody>';

  linhas.forEach((b, i) => {
    const c = S.cards.get(String(b.card_id)) || {};
    const n = notaDe(b);
    const meu = S.meuTime.has(String(b.card_id));
    const tierCls = c.tier === 'S+' ? 'sp' : c.tier === 'S' ? 's' : '';
    const imp = Array.isArray(b.impeto) ? b.impeto.join(' · ') : (b.impeto || '—');
    const hab = Array.isArray(b.habilidades) ? b.habilidades.join(', ') : '';
    h += '<tr class="carta" data-i="' + i + '">'
       + '<td><div class="nome"><button class="estrela' + (meu ? ' minha' : '') + '"'
       + ' data-id="' + esc(b.card_id) + '" title="'
       + (meu ? 'tirar do meu time' : 'pôr no meu time') + '">★</button>'
       + esc(c.nome || b.card_id) + '</div>'
       + '<div class="sub">' + esc(c.posicao_nativa || c.posicao || '') + ' · '
       + esc(c.estilo_de_jogo || '') + '</div></td>'
       + '<td>' + esc(c.ovr || '—') + ' <span class="pill ' + tierCls + '">'
       + esc(c.tier || '?') + '</span></td>'
       + '<td>' + esc(b.funcao) + '<div class="sub">' + esc(b.origem || '') + '</div></td>'
       + '<td><span class="nota">' + n.total.toFixed(1) + '</span>'
       + (n.extra ? '<div class="sub">' + n.base.toFixed(1) + ' + '
                  + n.extra.toFixed(2) + ' bônus</div>' : '')
       + (n.faltou.length ? '<div class="sub" style="color:var(--medio)">sem: '
                  + esc(n.faltou.join(', ')) + '</div>' : '')
       + '</td>'
       + '<td>' + esc(b.tecnico || '—') + '</td>'
       + '<td>' + esc(imp) + '</td>'
       + '<td class="hab">' + esc(hab) + '</td>'
       + '</tr>';
    if (S.aberta === i) h += detalhe(b, c, n);
  });
  h += '</tbody></table>';
  alvo.innerHTML = h;

  alvo.querySelectorAll('th[data-ord]').forEach(t => t.onclick = () => {
    const k = t.dataset.ord;
    if (S.ordem === k) S.desc = !S.desc; else { S.ordem = k; S.desc = true; }
    desenha();
  });
  alvo.querySelectorAll('.estrela').forEach(e => e.onclick = ev => {
    ev.stopPropagation();          // a estrela nao abre o detalhe junto
    viraMinha(e.dataset.id);
  });
  alvo.querySelectorAll('tr.carta').forEach(tr => tr.onclick = () => {
    const i = +tr.dataset.i;
    S.aberta = S.aberta === i ? null : i;
    desenha();
  });

  $('rodape').innerHTML = 'Lido do Supabase agora — o que aparece aqui é o que está no '
    + 'banco neste instante. O seu time (a estrela) fica só neste navegador'
    + (S.guarda ? ' e continua aqui quando você voltar.'
                : ', e some quando você fechar — este navegador não deixou guardar.');
}

function detalhe(b, c, n) {
  const bloco = (t, v) => '<div class="bloco"><h4>' + esc(t) + '</h4><div>' + v + '</div></div>';
  const hab = Array.isArray(b.habilidades) ? b.habilidades : [];
  return '<tr class="detalhe"><td colspan="' + COLUNAS.length + '"><div class="grade">'
    + bloco('nota', '<b style="font-size:27px;letter-spacing:-.5px">' + n.total.toFixed(2) + '</b>'
        + '<div class="sub">motor ' + n.base.toFixed(2)
        + ' · bônus ' + n.extra.toFixed(3) + '</div>')
    + bloco('técnico', esc(b.tecnico || '—'))
    + bloco('ímpeto', esc(Array.isArray(b.impeto) ? b.impeto.join(' · ') : (b.impeto || '—')))
    + bloco('estilo', esc(b.estilo || c.estilo_de_jogo || '—'))
    + bloco('as ' + hab.length + ' habilidades',
        hab.length ? hab.map(x => '<div>· ' + esc(x) + '</div>').join('') : '—')
    + bloco('identificação', '<div class="sub">id ' + esc(b.card_id) + '</div>'
        + '<div class="sub">' + esc(b.origem || '') + '</div>')
    + '</div></td></tr>';
}

// --------------------------------------------------------------- os avisos
function semConfig() {
  $('conteudo').innerHTML =
    '<div class="aviso"><h3>Falta apontar para o banco</h3>'
    + '<p>Abra este arquivo num editor de texto e preencha o bloco '
    + '<code>CFG</code>, lá no começo do <code>&lt;script&gt;</code>:</p>'
    + '<p><code>url</code> — o endereço do seu projeto no Supabase</p>'
    + '<p><code>anon</code> — a chave <b>anon</b>, a pública, de leitura</p>'
    + '<p style="color:var(--ruim)">⛔ Nunca ponha aqui a chave do '
    + '<code>config.txt</code>. Aquela escreve, e este arquivo é público.</p></div>';
  diz('sem configuração', true);
}

function falhou(e) {
  const msg = String(e && e.message || e);
  let dica = '';
  if (/HTTP 40[13]/.test(msg))
    dica = '<p>O banco recusou. Quase sempre é a permissão de leitura da chave '
         + '<b>anon</b> que ainda não foi dada nessa tabela.</p>';
  else if (/Failed to fetch|NetworkError/i.test(msg))
    dica = '<p>Não consegui falar com o banco. Pode ser internet, endereço errado, '
         + 'ou o CORS do Supabase.</p>';
  $('conteudo').innerHTML = '<div class="aviso ruim"><h3>Não deu para ler o banco</h3>'
    + dica + '<p><code>' + esc(msg) + '</code></p></div>';
  diz('erro', true);
}

// -------------------------------------------------------------- os eventos
let debounce;
$('busca').oninput = () => { clearTimeout(debounce); debounce = setTimeout(carrega, 350); };
$('funcao').onchange = carrega;
$('tier').onchange = carrega;
$('quantas').onchange = carrega;
$('soMeu').onclick = () => {
  S.soMeu = !S.soMeu;
  $('soMeu').classList.toggle('ligado', S.soMeu);
  carrega();
};

comeca();
</script>
</body>
</html>
